# Helyi futtatás egy paranccsal: `docker compose up -d`
#  - app: a Molio (1.0 demó, böngészős tárolással) → http://localhost:8080
#  - db:  PostgreSQL a végleges rendszerhez (a demó még nem használja)
services:
  app:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: molio
      POSTGRES_PASSWORD: molio
      POSTGRES_DB: molio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
